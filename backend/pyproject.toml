[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ"]

[tool.ruff.lint.isort]
known-first-party = ["config", "apps", "core"]

[tool.ruff.lint.per-file-ignores]
# settings 拆分的星号导入是 Django 社区惯例，不视为坏味道
"config/settings/*.py" = ["F403", "F405"]

[tool.ruff.format]
quote-style = "double"
