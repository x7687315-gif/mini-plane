# Mini Plane CI（Sprint 8）。
#
# 后端 job 按协作计划 §Sprint 8 的失败成本排序：先 lint（最快最便宜），
# 再格式检查，再"迁移无漂移 / schema 一致性"两个静态检查，最后才跑测试
# （最慢，且需要数据库）。
#
# 前端 job 由同学按同一模式添加（建议也放本文件，共享 concurrency）；
# 合并门槛：main 开 branch protection，两个 job 全绿才允许 merge。
# 仓库还没有远端时，本 workflow 首次推送 GitHub 后才真正执行（见 sprint-8 devlog）。

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend（lint + 静态检查 + 测试）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: miniplane_test
          POSTGRES_USER: miniplane
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miniplane -d miniplane_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SECRET_KEY: ci-not-a-secret
      DATABASE_URL: postgres://miniplane:ci-password@127.0.0.1:5432/miniplane_test
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: 安装依赖
        run: python -m pip install -r requirements/test.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      # 模型改了却没生成迁移 → 在这里红，而不是等同学 pull 代码后本地炸
      - name: 迁移无漂移（makemigrations --check）
        run: python manage.py makemigrations --check --settings=config.settings.test

      - name: OpenAPI schema 校验（spectacular 零警告）
        run: python manage.py spectacular --settings=config.settings.test --validate --fail-on-warn --file /tmp/openapi.yaml

      # 仓库内的 schema 快照必须与代码一致（改了 API 不重新生成 → diff 红）
      - name: OpenAPI schema 与 docs/api/openapi.yaml 一致
        run: diff -u ../docs/api/openapi.yaml /tmp/openapi.yaml

      # 测试建库本身就是"迁移从零重放"的验证（Django 会先跑完全部迁移）
      - name: 全量测试
        run: python manage.py test --settings=config.settings.test --noinput

      # Redis 服务容器不是摆设：用 Sprint 6 的 check_cache 实测 Redis 缓存后端
      # （单测固定 LocMem，Redis 后端的 delete_pattern 只有这里能真实执行）
      - name: Redis 缓存后端实测（check_cache）
        run: python manage.py check_cache --settings=config.settings.local
        env:
          CACHE_URL: redis://127.0.0.1:6379/0

  # ── 前端（Sprint 8）──────────────────────────────────────────────
  # 顺序与后端 job 同一套逻辑：先最便宜最能拦住的（lint / 类型），最后才 build。
  # 「四绿」的四个动作在 CI 里就是四个 step —— 与本地 `pnpm test && pnpm typecheck
  # && pnpm lint && pnpm build` 完全一致，避免"本地绿 CI 红"。
  frontend:
    name: frontend（lint + 类型 + 单测 + 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # 必须先装 pnpm 再 setup-node，否则 `cache: pnpm` 找不到命令
      - uses: pnpm/action-setup@v4
        with:
          # 与 package.json 的 packageManager 字段保持一致
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # --frozen-lockfile：lockfile 与 package.json 不一致时直接失败，
      # 而不是"顺手更新一下"——那样会把依赖漂移悄悄带进 main
      - name: 安装依赖（frozen lockfile）
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: 类型检查（tsc --noEmit）
        run: pnpm typecheck

      # 零依赖测试：node --test + Node 22 原生 TS 类型擦除，
      # tests/alias-loader.mjs 负责解析 @/ 别名（见 sprint-5 devlog §2.5）
      - name: 单元测试（node --test）
        run: pnpm test

      # 生产构建。next.config.ts 里 output: "standalone"，同时验证 Dockerfile 的
      # 构建阶段能拿到产物；typescript/eslint 的 ignore* 均为 false，构建即把关
      - name: 生产构建（next build）
        run: pnpm build
        env:
          NEXT_PUBLIC_API_BASE: http://127.0.0.1:8000
          NEXT_PUBLIC_WS_BASE: ws://127.0.0.1:8001
          NEXT_TELEMETRY_DISABLED: "1"

      # 构建产物自检：standalone 的入口必须存在，否则 Dockerfile 会在 COPY 时失败，
      # 而那个失败发生在 Docker 阶段（本 job 看不到）——所以提前在这里断言
      - name: 校验 standalone 产物存在
        run: test -f .next/standalone/server.js
