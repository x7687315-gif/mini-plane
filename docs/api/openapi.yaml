      - updated_at
      - workspace
    ProjectEngineering:
      type: object
      description: |-
        「我的工程」首页的项目工程摘要（Sprint 09，PRODUCT_REFACTOR_PLAN §7/§9）。

        字段全部由视图里**一条聚合查询**注解而来（correlated subquery，无 N+1）：
        任务计数 / 进度 / 当前阶段 / NOW / NEXT / 最近活动。进度 = 已完成 / 总数。
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        identifier:
          type: string
        workspace_slug:
          type: string
        workspace_name:
          type: string
        total_tasks:
          type: integer
        open_tasks:
          type: integer
        done_tasks:
          type: integer
        started_tasks:
          type: integer
        progress:
          type: number
          format: double
          readOnly: true
          description: 0~1；有 Global Plan 时=Σ(weight×progress)/Σweight，否则=已完成/总数
        current_stage:
          type: string
          nullable: true
          readOnly: true
          description: 有 Plan 时为当前 Stage 名，否则回退 NOW 任务所在状态名
        now_task:
          type: string
          nullable: true
          description: 当前正在做的任务标题
        next_task:
          type: string
          nullable: true
          description: 队列中下一个任务标题
        today_logs:
          type: integer
          description: 今日工程日志条数（Sprint 11）
        agent_running:
          type: boolean
          description: 是否有运行中的 Agent 会话（Sprint 13）
        last_activity:
          type: string
          format: date-time
          nullable: true
      required:
      - agent_running
      - current_stage
      - done_tasks
      - id
      - identifier
      - last_activity
      - name
      - next_task
      - now_task
      - open_tasks
      - progress
      - started_tasks
      - today_logs
      - total_tasks
      - workspace_name
      - workspace_slug
