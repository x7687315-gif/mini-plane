      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceMember'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMember'
          description: ''
    post:
      operationId: v1_workspaces_members_create
      description: GET：成员可读；POST：按 email 添加，仅 Admin（02 契约）。
      summary: 工作区成员列表 / 添加
      parameters:
      - in: path
        name: workspace_slug
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceMemberAdd'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WorkspaceMemberAdd'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkspaceMemberAdd'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceMember'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMember'
          description: ''
  /api/v1/workspaces/{workspace_slug}/members/{member_id}/:
    patch:
      operationId: v1_workspaces_members_partial_update
      description: 改角色 / 移除成员；仅 Admin。owner 不可动 + 至少保留一位 Admin。
      summary: 修改成员角色
      parameters:
      - in: path
        name: member_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_slug
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
