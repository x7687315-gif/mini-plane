            * `none` - 无
            * `urgent` - 紧急
            * `high` - 高
            * `medium` - 中
            * `low` - 低
        state_id:
          type: string
          format: uuid
          description: 状态 id；省略则创建时取项目 Backlog
        assignee_id:
          type: string
          format: uuid
          nullable: true
          description: 被指派人 id；必须是该项目成员，null 表示清空
        label_ids:
          type: array
