        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          default: 15
      required:
      - user_id
    ProjectWrite:
      type: object
      description: 创建 / 更新请求体。identifier 唯一性（工作区内）由 service 显式校验。
      properties:
        name:
          type: string
          title: 名称
          maxLength: 120
        identifier:
          type: string
          description: 2-5 位大写字母数字，Issue 前缀
          pattern: ^[A-Z][A-Z0-9]{1,4}$
          maxLength: 5
        description:
          type: string
          title: 描述
