openapi: 3.0.3
info:
  title: Mini Plane API
  version: 0.1.0
  description: 仿 Plane 的迷你项目管理软件（学习项目）REST API。
paths:
  /api/v1/auth/csrf/:
    get:
      operationId: v1_auth_csrf_retrieve
      description: 写操作（POST/PATCH/DELETE）前调用：服务端种下 csrftoken cookie，前端读取后以 X-CSRFToken
        请求头回传。
      summary: 获取 CSRF Cookie
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: CSRF cookie 已设置。
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: 会话登录。失败不区分"用户不存在/密码错误"，并按用户名做失败锁定。
      summary: 登录
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: 销毁 session；需要 X-CSRFToken 头（SessionAuthentication 强制校验）。
      summary: 登出
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      description: 返回当前登录用户；未登录由统一异常处理转为 401。
      summary: 当前用户
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      description: 注册即登录：创建用户后种下 session，省一次登录往返。
      summary: 注册（成功后自动登录）
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/health/:
    get:
      operationId: health_check
      description: 探测服务、数据库与缓存状态；数据库或缓存不可达时返回 503。供本地验证与后续容器编排使用。
      summary: 健康检查
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                    - error
                  database:
                    type: string
                    enum:
                    - ok
                    - error
                  cache:
                    type: string
                    enum:
                    - ok
                    - error
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                    - error
                  database:
                    type: string
                    enum:
                    - ok
                    - error
                  cache:
                    type: string
                    enum:
                    - ok
                    - error
          description: ''
  /api/v1/workspaces/:
    get:
      operationId: v1_workspaces_list
      description: GET：仅返回我是成员的工作区；POST：创建并成为 ADMIN（02 契约）。
      summary: 工作区列表 / 创建
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
    post:
      operationId: v1_workspaces_create
      description: GET：仅返回我是成员的工作区；POST：创建并成为 ADMIN（02 契约）。
      summary: 工作区列表 / 创建
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WorkspaceWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkspaceWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
  /api/v1/workspaces/{workspace_slug}/:
    get:
      operationId: v1_workspaces_retrieve
      description: GET：成员可读；PATCH / DELETE：仅 Admin（非成员一律 404）。
      summary: 工作区详情
      parameters:
      - in: path
        name: workspace_slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
    patch:
      operationId: v1_workspaces_partial_update
      description: GET：成员可读；PATCH / DELETE：仅 Admin（非成员一律 404）。
      summary: 修改工作区
      parameters:
      - in: path
        name: workspace_slug
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWorkspaceWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedWorkspaceWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedWorkspaceWrite'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
    delete:
      operationId: v1_workspaces_destroy
      description: GET：成员可读；PATCH / DELETE：仅 Admin（非成员一律 404）。
      summary: 删除工作区
      parameters:
      - in: path
        name: workspace_slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/workspaces/{workspace_slug}/members/:
    get:
      operationId: v1_workspaces_members_list
      description: GET：成员可读；POST：按 email 添加，仅 Admin（02 契约）。
      summary: 工作区成员列表 / 添加
      parameters:
      - in: path
        name: workspace_slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
