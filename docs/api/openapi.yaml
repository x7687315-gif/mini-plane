openapi: 3.0.3
info:
  title: Mini Plane API
  version: 0.1.0
  description: 仿 Plane 的迷你项目管理软件（学习项目）REST API。
paths:
  /api/v1/agent/projects/{workspace_slug}/{project_id}/:
    get:
      operationId: v1_agent_projects_retrieve
      description: project.get：项目 + Global Plan 快照。
      summary: project.get：项目 + Global Plan 快照
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - agentTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProjectSnapshot'
          description: ''
  /api/v1/agent/projects/{workspace_slug}/{project_id}/progress/:
    post:
      operationId: v1_agent_projects_progress_create
      description: progress.update / stage.update：改某阶段进度或切换当前阶段。
      summary: progress.update：改阶段进度 / 切当前阶段（幂等）
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_slug
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentProgress'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgentProgress'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgentProgress'
      security:
      - agentTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPlan'
          description: ''
  /api/v1/agent/projects/{workspace_slug}/{project_id}/sessions/:
    get:
      operationId: v1_agent_projects_sessions_list
      summary: agent.sessions：项目会话列表（?active=1 只看运行中）
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - agentTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentSession'
          description: ''
  /api/v1/agent/sessions/:
    post:
      operationId: v1_agent_sessions_create
      summary: session.start：开始一次 Agent 运行（广播 agent.session）
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentSessionStart'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgentSessionStart'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgentSessionStart'
        required: true
      security:
      - agentTokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSession'
          description: ''
  /api/v1/agent/sessions/{session_id}/end/:
    post:
      operationId: v1_agent_sessions_end_create
      summary: session.end：结束会话（done/failed/stopped，广播 agent.session）
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentSessionEnd'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgentSessionEnd'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgentSessionEnd'
      security:
      - agentTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSession'
          description: ''
  /api/v1/agent/tasks/:
    post:
      operationId: v1_agent_tasks_create
      description: task.create：建任务（写 Activity）。幂等键防重复建。
      summary: task.create：建任务（幂等）
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentTaskCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgentTaskCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgentTaskCreate'
        required: true
      security:
      - agentTokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          description: ''
  /api/v1/agent/tasks/{issue_id}/complete/:
    post:
      operationId: v1_agent_tasks_complete_create
      description: task.complete：把任务推进到「已完成」组的首个状态。
      summary: task.complete：推进到已完成
      parameters:
      - in: path
        name: issue_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - agentTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          description: ''
  /api/v1/agent/tasks/{issue_id}/start/:
    post:
      operationId: v1_agent_tasks_start_create
      description: task.start：把任务推进到「进行中」组的首个状态。
      summary: task.start：推进到进行中
      parameters:
      - in: path
        name: issue_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - agentTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          description: ''
  /api/v1/agent/tokens/:
    get:
      operationId: v1_agent_tokens_list
      description: GET 我的 Token 列表；POST 新建并**一次性**返回明文。
      summary: Agent Token 列表 / 创建
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentToken'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTokenCreated'
          description: ''
    post:
      operationId: v1_agent_tokens_create
      description: GET 我的 Token 列表；POST 新建并**一次性**返回明文。
      summary: Agent Token 列表 / 创建
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentTokenCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgentTokenCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgentTokenCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentToken'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTokenCreated'
          description: ''
  /api/v1/agent/tokens/{token_id}/revoke/:
    post:
      operationId: v1_agent_tokens_revoke_create
      summary: 吊销 Agent Token
      parameters:
      - in: path
        name: token_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentToken'
          description: ''
  /api/v1/agent/worklogs/:
    post:
      operationId: v1_agent_worklogs_create
      description: worklog.create：Agent 写工程日志（source=agent）。
      summary: worklog.create：Agent 写工程日志（幂等）
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentWorklogCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgentWorklogCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgentWorklogCreate'
        required: true
      security:
      - agentTokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Worklog'
          description: ''
  /api/v1/auth/bind/:
    post:
      operationId: v1_auth_bind_create
      description: |-
        设置页自助：加/改密码、绑定/换邮箱、或移除密码回到免密直入。

        改密后 `update_session_auth_hash` 保住当前会话（否则 set_password 会踢掉自己）。
      summary: 绑定 / 修改密码或邮箱（仅本人）
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Bind'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Bind'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Bind'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/csrf/:
    get:
      operationId: v1_auth_csrf_retrieve
      description: 写操作（POST/PATCH/DELETE）前调用：服务端种下 csrftoken cookie，前端读取后以 X-CSRFToken
        请求头回传。
      summary: 获取 CSRF Cookie
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: CSRF cookie 已设置。
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: |-
        会话登录。本地单机版语义：

        - 免密账户（未绑定密码）：仅凭昵称直接登录，无需二级验证；
        - 已绑定密码的账户：昵称 + 密码校验，失败按用户名做防暴力锁定，且不区分
          "用户不存在 / 密码错误"（防探测）；
        - 只给昵称时：账户有密码 → 401 `password_required`（前端补密码框）；
          账户不存在 → 404 `not_found`（前端提示可新建）。
      summary: 登录 / 昵称直入
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: 销毁 session；需要 X-CSRFToken 头（SessionAuthentication 强制校验）。
      summary: 登出
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      description: 返回当前登录用户；未登录由统一异常处理转为 401。
      summary: 当前用户
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      description: 注册即登录：创建用户后种下 session，省一次登录往返。
      summary: 注册（成功后自动登录）
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/health/:
    get:
      operationId: health_check
      description: 探测服务、数据库与缓存状态；数据库或缓存不可达时返回 503。供本地验证与后续容器编排使用。
      summary: 健康检查
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                    - error
                  database:
                    type: string
                    enum:
                    - ok
                    - error
                  cache:
                    type: string
                    enum:
                    - ok
                    - error
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                    - error
                  database:
                    type: string
                    enum:
                    - ok
                    - error
                  cache:
                    type: string
                    enum:
                    - ok
                    - error
          description: ''
  /api/v1/issues/mine/:
    get:
      operationId: v1_issues_mine_list
      description: |-
        跨用户可访问的项目，聚合「指派给我 / 我创建的」Issue（特色功能 B）。

        `scope`：`assigned`（指派给我）| `created`（我创建）| `all`（默认，二者并集）。
        可见性沿用 `accessible_project_ids`（ProjectMember 或 WS 成员），与单项目读取同一套规则；
        排序按创建时间倒序，分页沿用 StandardPagination。
      summary: 我的工作（跨项目聚合）
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyIssue'
          description: ''
  /api/v1/projects/mine/:
    get:
      operationId: v1_projects_mine_list
      description: |-
        个人模式首页数据源（Sprint 09，PRODUCT_REFACTOR_PLAN §7）。

        返回当前用户可访问的每个项目的工程摘要：任务计数、进度、当前阶段、
        NOW（正在做）/ NEXT（队列下一个）、最近活动时间。Workspace 在此被"降级"为
        归属信息（slug/name），不再要求用户先理解工作区才能看到自己的工程。
      summary: 我的工程（跨项目工程摘要）
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectEngineering'
          description: ''
  /api/v1/workspaces/:
    get:
      operationId: v1_workspaces_list
      description: GET：仅返回我是成员的工作区；POST：创建并成为 ADMIN（02 契约）。
      summary: 工作区列表 / 创建
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
    post:
      operationId: v1_workspaces_create
      description: GET：仅返回我是成员的工作区；POST：创建并成为 ADMIN（02 契约）。
      summary: 工作区列表 / 创建
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WorkspaceWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkspaceWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
  /api/v1/workspaces/{workspace_slug}/:
    get:
      operationId: v1_workspaces_retrieve
      description: GET：成员可读；PATCH / DELETE：仅 Admin（非成员一律 404）。
      summary: 工作区详情
      parameters:
      - in: path
        name: workspace_slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
    patch:
      operationId: v1_workspaces_partial_update
      description: GET：成员可读；PATCH / DELETE：仅 Admin（非成员一律 404）。
      summary: 修改工作区
      parameters:
      - in: path
        name: workspace_slug
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWorkspaceWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedWorkspaceWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedWorkspaceWrite'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
    delete:
      operationId: v1_workspaces_destroy
      description: GET：成员可读；PATCH / DELETE：仅 Admin（非成员一律 404）。
      summary: 删除工作区
      parameters:
      - in: path
        name: workspace_slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/workspaces/{workspace_slug}/members/:
    get:
      operationId: v1_workspaces_members_list
      description: GET：成员可读；POST：按 email 添加，仅 Admin（02 契约）。
      summary: 工作区成员列表 / 添加
      parameters:
      - in: path
        name: workspace_slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceMember'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMember'
          description: ''
    post:
      operationId: v1_workspaces_members_create
      description: GET：成员可读；POST：按 email 添加，仅 Admin（02 契约）。
      summary: 工作区成员列表 / 添加
      parameters:
      - in: path
        name: workspace_slug
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceMemberAdd'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WorkspaceMemberAdd'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkspaceMemberAdd'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceMember'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMember'
          description: ''
  /api/v1/workspaces/{workspace_slug}/members/{member_id}/:
    patch:
      operationId: v1_workspaces_members_partial_update
      description: 改角色 / 移除成员；仅 Admin。owner 不可动 + 至少保留一位 Admin。
      summary: 修改成员角色
      parameters:
      - in: path
        name: member_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_slug
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWorkspaceMemberRole'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedWorkspaceMemberRole'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedWorkspaceMemberRole'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMember'
          description: ''
    delete:
      operationId: v1_workspaces_members_destroy
      description: 改角色 / 移除成员；仅 Admin。owner 不可动 + 至少保留一位 Admin。
      summary: 移除成员
      parameters:
      - in: path
        name: member_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/workspaces/{workspace_slug}/projects/:
    get:
      operationId: v1_workspaces_projects_list
      description: GET：WS 成员可见全部项目（批量算生效角色防 N+1）；POST：WS Member+ 可创建。
      summary: 项目列表 / 创建
      parameters:
      - in: path
        name: workspace_slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
          description: ''
        '201':
          content:
