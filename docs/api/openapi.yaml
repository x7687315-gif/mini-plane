  /api/v1/workspaces/{workspace_slug}/projects/{project_id}/activities/:
    get:
      operationId: v1_workspaces_projects_activities_list
      description: 跨 Issue 的项目级活动流，倒序分页。
      summary: 项目活动流（倒序）
