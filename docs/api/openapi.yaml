      - identifier
      - name
    Register:
      type: object
      description: 注册请求体；username/email 的唯一性校验由 ModelSerializer 自动生成。
      properties:
        username:
          type: string
          title: 用户名
          description: 必填；长度为150个字符或以下；只能包含字母、数字、特殊字符“@”、“.”、“-”和“_”。
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: 电子邮件地址
          maxLength: 254
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
      - username
