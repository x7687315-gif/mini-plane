      - title
      - updated_at
      - workspace_slug
    PatchedCommentWrite:
      type: object
      description: 评论创建 / 更新请求体；content 非空（纯空白也会被 CharField 裁掉后判空）。
      properties:
        content:
          type: string
          title: 内容
    PatchedIssueWrite:
      type: object
      description: |-
        Issue 创建 / 部分更新请求体。

        产出约定：`*_id` 入参在校验后会被**替换**成对应的模型实例
        （`state_id` → `state`、`assignee_id` → `assignee`、`label_ids` → `labels`），
        视图可以直接 `services.create_issue(project, user, **serializer.validated_data)`。

        只读字段（sequence_id / created_by / project）不在此列，客户端传入即被忽略。
      properties:
        title:
          type: string
          description: 标题，必填
          maxLength: 255
        description:
          type: string
          default: ''
          description: 描述，可省略
        priority:
          allOf:
          - $ref: '#/components/schemas/PriorityEnum'
          default: none
          description: |-
            优先级：none/urgent/high/medium/low

            * `none` - 无
            * `urgent` - 紧急
            * `high` - 高
            * `medium` - 中
            * `low` - 低
        state_id:
          type: string
          format: uuid
          description: 状态 id；省略则创建时取项目 Backlog
        assignee_id:
          type: string
          format: uuid
          nullable: true
          description: 被指派人 id；必须是该项目成员，null 表示清空
        label_ids:
          type: array
          items:
            type: string
            format: uuid
          description: 标签 id 列表（最多 50 个）；空数组表示清空标签
          maxItems: 50
    PatchedLabelWrite:
