      - name
      - owner
      - slug
      - updated_at
    WorkspaceMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/UserLite'
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
          title: 角色
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - role
      - user
    WorkspaceMemberAdd:
      type: object
      properties:
        email:
          type: string
          format: email
          description: 被邀请用户的注册邮箱
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          default: 15
      required:
      - email
    WorkspaceWrite:
      type: object
      description: 创建 / 更新请求体。slug 可省略；唯一性冲突由 service 层做自动后缀。
      properties:
        name:
          type: string
          title: 名称
          maxLength: 80
        slug:
          type: string
          description: 可省略；缺省由 name 生成，冲突自动追加 -2/-3…
          pattern: ^[a-z0-9-]{2,32}$
      required:
      - name
  securitySchemes:
    agentTokenAuth:
      type: http
      scheme: bearer
      description: Agent Token（mpa_ 前缀），权限受 scopes 白名单限制。
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
