components:
  schemas:
    ActionEnum:
      enum:
      - created
      - updated
      - deleted
      type: string
      description: |-
        * `created` - 创建
        * `updated` - 修改
        * `deleted` - 删除
    ActivityLog:
      type: object
      description: |-
        一条留痕的展示形态。

        `old_value` / `new_value` 里的值在写入时已翻译成可直接展示的形态
        （见 activity.services.capture_issue_snapshot），前端拼句子即可。
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actor:
          allOf:
          - $ref: '#/components/schemas/UserLite'
          readOnly: true
        entity_type:
          allOf:
          - $ref: '#/components/schemas/EntityTypeEnum'
          readOnly: true
          title: 对象类型
        entity_id:
          type: string
          format: uuid
          readOnly: true
          title: 对象 id
        issue:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          title: 任务
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          readOnly: true
          title: 动作
        old_value:
          readOnly: true
          nullable: true
          title: 变更前
        new_value:
          readOnly: true
          nullable: true
          title: 变更后
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - created_at
      - entity_id
      - entity_type
      - id
      - issue
      - new_value
      - old_value
    Comment:
      type: object
      description: 评论只读响应体（05 契约）；author 复用成员摘要，不含 email。
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        issue:
          type: string
          format: uuid
          readOnly: true
          title: 任务
        author:
          allOf:
          - $ref: '#/components/schemas/UserLite'
          readOnly: true
        content:
          type: string
          readOnly: true
          title: 内容
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - content
      - created_at
      - id
      - issue
      - updated_at
    CommentWrite:
      type: object
      description: 评论创建 / 更新请求体；content 非空（纯空白也会被 CharField 裁掉后判空）。
      properties:
        content:
          type: string
          title: 内容
      required:
      - content
    EntityTypeEnum:
      enum:
      - issue
      - comment
      - state
      - label
      - project
      - workspace
      - member
      type: string
      description: |-
        * `issue` - 任务
        * `comment` - 评论
        * `state` - 状态
        * `label` - 标签
        * `project` - 项目
        * `workspace` - 工作区
        * `member` - 成员
    GroupEnum:
      enum:
      - backlog
      - unstarted
      - started
      - completed
      - cancelled
      type: string
      description: |-
        * `backlog` - 待规划
        * `unstarted` - 未开始
        * `started` - 进行中
        * `completed` - 已完成
        * `cancelled` - 已取消
    Issue:
      type: object
      description: Issue 只读响应体。调用方需 select_related(state/assignee/created_by) + prefetch(labels)。
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sequence_id:
          type: integer
          readOnly: true
          title: 项目内序号
        project:
          type: string
          format: uuid
          readOnly: true
          title: 项目
        title:
          type: string
          readOnly: true
          title: 标题
        description:
          type: string
          readOnly: true
          title: 描述
        priority:
          allOf:
          - $ref: '#/components/schemas/PriorityEnum'
          readOnly: true
          title: 优先级
        state:
          allOf:
          - $ref: '#/components/schemas/State'
          readOnly: true
        assignee:
          allOf:
          - $ref: '#/components/schemas/UserLite'
          readOnly: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserLite'
          readOnly: true
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assignee
      - created_at
      - created_by
      - description
      - id
      - labels
      - priority
      - project
      - sequence_id
      - state
      - title
      - updated_at
    IssueBulkLabels:
      type: object
      description: |-
        批量改标签请求体（Sprint 6，**覆盖式**：把选中 Issue 的标签整体替换）。

        只做跨作用域校验；真正的执行在异步任务里（apps/jobs/tasks.py），
        所以这里刻意不碰数据库写入。
      properties:
        issue_ids:
          type: array
          items:
            type: string
            format: uuid
          description: 要批量修改的 Issue id 列表
        label_ids:
          type: array
          items:
            type: string
            format: uuid
          description: 目标标签 id 列表；空数组表示清空这些 Issue 的标签
      required:
      - issue_ids
    IssueWrite:
      type: object
      description: |-
        Issue 创建 / 部分更新请求体。

        产出约定：`*_id` 入参在校验后会被**替换**成对应的模型实例
        （`state_id` → `state`、`assignee_id` → `assignee`、`label_ids` → `labels`），
        视图可以直接 `services.create_issue(project, user, **serializer.validated_data)`。

        只读字段（sequence_id / created_by / project）不在此列，客户端传入即被忽略。
      properties:
        title:
          type: string
          description: 标题，必填
          maxLength: 255
        description:
          type: string
          default: ''
          description: 描述，可省略
        priority:
          allOf:
          - $ref: '#/components/schemas/PriorityEnum'
          default: none
          description: |-
            优先级：none/urgent/high/medium/low

            * `none` - 无
            * `urgent` - 紧急
            * `high` - 高
            * `medium` - 中
            * `low` - 低
        state_id:
          type: string
          format: uuid
          description: 状态 id；省略则创建时取项目 Backlog
        assignee_id:
          type: string
          format: uuid
          nullable: true
          description: 被指派人 id；必须是该项目成员，null 表示清空
        label_ids:
          type: array
          items:
            type: string
            format: uuid
          description: 标签 id 列表；空数组表示清空标签
      required:
      - title
    KindEnum:
      enum:
      - bulk_assign_labels
      type: string
      description: '* `bulk_assign_labels` - 批量修改标签'
    Label:
      type: object
      description: 标签只读响应体（同时内嵌在 Issue.labels 里）。
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
          title: 名称
        color:
          type: string
          readOnly: true
          title: 颜色
          description: '#RRGGBB'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - color
      - created_at
      - id
      - name
    LabelWrite:
      type: object
      description: 标签创建 / 更新请求体；项目内 name 唯一由 service 显式校验。
      properties:
        name:
          type: string
          title: 名称
          maxLength: 60
        color:
          type: string
          title: 颜色
          description: '#RRGGBB'
          maxLength: 9
      required:
      - name
    Login:
      type: object
      description: 登录请求体。失败文案统一为"用户名或密码错误"，防用户名探测。
      properties:
        username:
          type: string
          description: 用户名
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    PatchedCommentWrite:
      type: object
      description: 评论创建 / 更新请求体；content 非空（纯空白也会被 CharField 裁掉后判空）。
      properties:
        content:
          type: string
          title: 内容
    PatchedIssueWrite:
