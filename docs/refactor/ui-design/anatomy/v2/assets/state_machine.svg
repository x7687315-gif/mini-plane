<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="740" viewBox="0 0 1500 740"><title>Spatial and temporal states</title><rect width="100%" height="100%" fill="#F4F1EA"/><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1F3FA8"/></marker><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M 28 0 L 0 0 0 28" fill="none" stroke="#C8C3B4" stroke-width="0.7" opacity="0.4"/></pattern></defs><rect width="100%" height="100%" fill="url(#grid)" opacity="0.65"/><text x="60" y="60" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="27" fill="#1F3FA8" font-weight="700" text-anchor="start">INTERACTION STATE MACHINE</text><text x="60" y="106" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="21" fill="#1B1A17" font-weight="500" text-anchor="start">空间状态与时间状态分开建模，避免多个布尔值组合出不可能的 UI。</text><text x="65" y="170" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="18" fill="#8C887E" font-weight="700" text-anchor="start">空间维度 · Spatial</text><rect x="80" y="205" width="360" height="135" rx="10" fill="#FBF9F4" stroke="#C8C3B4" stroke-width="2"/><text x="102" y="245" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="20" fill="#1B1A17" font-weight="700" text-anchor="start">OVERVIEW</text><text x="102" y="283" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="16" fill="#5A5851" font-weight="400" text-anchor="start">完整对象 / 当前状态</text><rect x="515" y="205" width="360" height="135" rx="10" fill="#E2E7F5" stroke="#1F3FA8" stroke-width="2"/><text x="537" y="245" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="20" fill="#1F3FA8" font-weight="700" text-anchor="start">FOCUS</text><text x="537" y="283" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="16" fill="#5A5851" font-weight="400" text-anchor="start">聚焦一个 Stage</text><rect x="950" y="205" width="360" height="135" rx="10" fill="#FBF9F4" stroke="#C8C3B4" stroke-width="2"/><text x="972" y="245" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="20" fill="#1B1A17" font-weight="700" text-anchor="start">EXPLODED</text><text x="972" y="283" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="16" fill="#5A5851" font-weight="400" text-anchor="start">展开到 Task 层</text><path d="M440,272 L505,272" fill="none" stroke="#1F3FA8" stroke-width="3" marker-end="url(#arr)"/><path d="M875,272 L940,272" fill="none" stroke="#1F3FA8" stroke-width="3" marker-end="url(#arr)"/><line x1="1125" y1="345" x2="1125" y2="390" stroke="#1F3FA8" stroke-width="2"/><path d="M1125,390 L260,390" fill="none" stroke="#1F3FA8" stroke-width="3" marker-end="url(#arr)"/><text x="690" y="380" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="14" fill="#1F3FA8" font-weight="600" text-anchor="middle">恢复整体 / ESC / Back</text><text x="65" y="455" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="18" fill="#8C887E" font-weight="700" text-anchor="start">时间维度 · Temporal</text><rect x="80" y="490" width="360" height="125" rx="10" fill="#FBF9F4" stroke="#C8C3B4" stroke-width="2"/><text x="100" y="530" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="20" fill="#1B1A17" font-weight="700" text-anchor="start">CURRENT</text><text x="100" y="568" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="16" fill="#5A5851" font-weight="400" text-anchor="start">读取当前业务状态</text><rect x="515" y="490" width="360" height="125" rx="10" fill="#F3E5CE" stroke="#BD873E" stroke-width="2"/><text x="535" y="530" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="20" fill="#BD873E" font-weight="700" text-anchor="start">EVENT / LOG</text><text x="535" y="568" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="16" fill="#5A5851" font-weight="400" text-anchor="start">浏览实际记录与审计事件</text><rect x="950" y="490" width="360" height="125" rx="10" fill="#FBF9F4" stroke="#C8C3B4" stroke-width="2"/><text x="970" y="530" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="20" fill="#1B1A17" font-weight="700" text-anchor="start">SNAPSHOT</text><text x="970" y="568" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="15" fill="#5A5851" font-weight="400" text-anchor="start">只有已保存状态才能复现过去</text><path d="M440,552 L505,552" fill="none" stroke="#BD873E" stroke-width="3" marker-end="url(#arr)"/><path d="M875,552 L940,552" fill="none" stroke="#BD873E" stroke-width="3" marker-end="url(#arr)"/><text x="80" y="675" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="17" fill="#1B1A17" font-weight="600" text-anchor="start">选择日期不会自动把当前数据“倒回去”；历史事件浏览与历史状态重建是两个不同能力。</text></svg>