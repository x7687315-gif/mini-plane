<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><title>Mini Plane anatomy architecture</title><rect width="100%" height="100%" fill="#F4F1EA"/><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1F3FA8"/></marker><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M 28 0 L 0 0 0 28" fill="none" stroke="#C8C3B4" stroke-width="0.7" opacity="0.4"/></pattern></defs><rect width="100%" height="100%" fill="url(#grid)" opacity="0.65"/><text x="64" y="68" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="28" fill="#1F3FA8" font-weight="700" text-anchor="start">MINI PLANE · ANATOMY ENGINE</text><text x="64" y="112" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="25" fill="#1B1A17" font-weight="500" text-anchor="start">从领域数据，到可探索的工程图；从当前状态，到可追溯的历史</text><rect x="65" y="165" width="310" height="650" rx="12" fill="#FBF9F4" stroke="#C8C3B4" stroke-width="2"/><text x="88" y="205" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="22" fill="#1B1A17" font-weight="700" text-anchor="start">01  真实数据源</text><text x="88" y="240" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="16" fill="#5A5851" font-weight="400" text-anchor="start">不制造不存在的关系</text><rect x="88" y="250" width="264" height="70" rx="7" fill="#E2E7F5" stroke="#1F3FA8" stroke-width="1.6"/><text x="104" y="280" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="18" fill="#1B1A17" font-weight="700" text-anchor="start">Project / Plan</text><text x="104" y="307" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="13" fill="#5A5851" font-weight="400" text-anchor="start">项目身份与总体目标</text><rect x="88" y="350" width="264" height="70" rx="7" fill="#E2E7F5" stroke="#1F3FA8" stroke-width="1.6"/><text x="104" y="380" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="18" fill="#1B1A17" font-weight="700" text-anchor="start">ProjectStage</text><text x="104" y="407" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="13" fill="#5A5851" font-weight="400" text-anchor="start">阶段、顺序、权重、记录进度</text><rect x="88" y="450" width="264" height="70" rx="7" fill="#E2E7F5" stroke="#1F3FA8" stroke-width="1.6"/><text x="104" y="480" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="18" fill="#1B1A17" font-weight="700" text-anchor="start">Task（表 Issue）</text><text x="104" y="507" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="13" fill="#5A5851" font-weight="400" text-anchor="start">状态、优先级、可选 stage</text><rect x="88" y="550" width="264" height="70" rx="7" fill="#F3E5CE" stroke="#BD873E" stroke-width="1.6"/><text x="104" y="580" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="18" fill="#1B1A17" font-weight="700" text-anchor="start">Worklog</text><text x="104" y="607" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="13" fill="#5A5851" font-weight="400" text-anchor="start">实际工作记录、可选 stage</text><rect x="88" y="650" width="264" height="70" rx="7" fill="#F3E5CE" stroke="#BD873E" stroke-width="1.6"/><text x="104" y="680" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="18" fill="#1B1A17" font-weight="700" text-anchor="start">ActivityLog</text><text x="104" y="707" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="13" fill="#5A5851" font-weight="400" text-anchor="start">有限范围的审计字段差异</text><rect x="88" y="750" width="264" height="70" rx="7" fill="#DDEDE8" stroke="#4B8F83" stroke-width="1.6"/><text x="104" y="780" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="18" fill="#1B1A17" font-weight="700" text-anchor="start">AgentSession</text><text x="104" y="807" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="13" fill="#5A5851" font-weight="400" text-anchor="start">真实存在的运行会话</text><rect x="425" y="165" width="300" height="650" rx="12" fill="#FBF9F4" stroke="#C8C3B4" stroke-width="2"/><text x="450" y="205" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="22" fill="#1B1A17" font-weight="700" text-anchor="start">02  纯计算层</text><text x="450" y="240" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="16" fill="#5A5851" font-weight="400" text-anchor="start">可单测 · 可重复 · 稳定布局</text><rect x="450" y="261" width="250" height="88" rx="8" fill="#FFFFFF" stroke="#1F3FA8" stroke-width="1.7"/><text x="575" y="299" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="18" fill="#1B1A17" font-weight="700" text-anchor="middle">View Model</text><text x="575" y="327" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="13" fill="#5A5851" font-weight="400" text-anchor="middle">把 API 类型映射为显示语义</text><rect x="450" y="391" width="250" height="88" rx="8" fill="#FFFFFF" stroke="#1F3FA8" stroke-width="1.7"/><text x="575" y="429" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="18" fill="#1B1A17" font-weight="700" text-anchor="middle">Layout Model</text><text x="575" y="457" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="13" fill="#5A5851" font-weight="400" text-anchor="middle">按稳定 ID / order 计算坐标</text><rect x="450" y="521" width="250" height="88" rx="8" fill="#FFFFFF" stroke="#1F3FA8" stroke-width="1.7"/><text x="575" y="559" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="18" fill="#1B1A17" font-weight="700" text-anchor="middle">State Machine</text><text x="575" y="587" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="13" fill="#5A5851" font-weight="400" text-anchor="middle">overview / focus / exploded</text><rect x="450" y="651" width="250" height="88" rx="8" fill="#FFFFFF" stroke="#BD873E" stroke-width="1.7"/><text x="575" y="689" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="18" fill="#1B1A17" font-weight="700" text-anchor="middle">History Selector</text><text x="575" y="717" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="13" fill="#5A5851" font-weight="400" text-anchor="middle">current / event / snapshot</text><rect x="790" y="165" width="735" height="650" rx="12" fill="#FBF9F4" stroke="#C8C3B4" stroke-width="2"/><text x="815" y="205" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="22" fill="#1B1A17" font-weight="700" text-anchor="start">03  表现层 · 单一工程解剖图</text><text x="815" y="240" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="16" fill="#5A5851" font-weight="400" text-anchor="start">结构 / 仪器观察 / 演进痕迹，共用同一个对象</text><g stroke="#5A5851" stroke-width="2" fill="#EBE7DD"><polygon points="860,325 930,290 1000,325 930,360"/><polygon points="860,325 860,390 930,425 930,360"/><polygon points="930,360 1000,325 1000,390 930,425"/></g><text x="930" y="380" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="17" fill="#5A5851" font-weight="700" text-anchor="middle">01</text><g stroke="#1F3FA8" stroke-width="2" fill="#E2E7F5"><polygon points="1080,325 1150,290 1220,325 1150,360"/><polygon points="1080,325 1080,390 1150,425 1150,360"/><polygon points="1150,360 1220,325 1220,390 1150,425"/></g><text x="1150" y="380" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="17" fill="#1F3FA8" font-weight="700" text-anchor="middle">02</text><g stroke="#5A5851" stroke-width="2" fill="#EBE7DD"><polygon points="860,510 930,475 1000,510 930,545"/><polygon points="860,510 860,575 930,610 930,545"/><polygon points="930,545 1000,510 1000,575 930,610"/></g><text x="930" y="565" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="17" fill="#5A5851" font-weight="700" text-anchor="middle">03</text><g stroke="#5A5851" stroke-width="2" fill="#EBE7DD"><polygon points="1080,510 1150,475 1220,510 1150,545"/><polygon points="1080,510 1080,575 1150,610 1150,545"/><polygon points="1150,545 1220,510 1220,575 1150,610"/></g><text x="1150" y="565" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="17" fill="#5A5851" font-weight="700" text-anchor="middle">04</text><rect x="1110" y="310" width="14" height="14" rx="1" fill="#1F3FA8" stroke="#1F3FA8" stroke-width="1"/><rect x="1136" y="310" width="14" height="14" rx="1" fill="#1F3FA8" stroke="#1F3FA8" stroke-width="1"/><rect x="1162" y="310" width="14" height="14" rx="1" fill="#1F3FA8" stroke="#1F3FA8" stroke-width="1"/><rect x="1110" y="331" width="14" height="14" rx="1" fill="#FBF9F4" stroke="#5A5851" stroke-width="1"/><rect x="1136" y="331" width="14" height="14" rx="1" fill="#FBF9F4" stroke="#5A5851" stroke-width="1"/><rect x="1162" y="331" width="14" height="14" rx="1" fill="#FBF9F4" stroke="#5A5851" stroke-width="1"/><line x1="1240" y1="330" x2="1340" y2="290" stroke="#BD873E" stroke-width="2" stroke-dasharray="5 5"/><text x="1345" y="285" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="15" fill="#BD873E" font-weight="600" text-anchor="start">新增模块 / 事件</text><line x1="1150" y1="630" x2="1255" y2="665" stroke="#1F3FA8" stroke-width="2"/><text x="1260" y="673" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="15" fill="#1F3FA8" font-weight="600" text-anchor="start">聚焦 / 分解</text><path d="M375,490 L425,490" fill="none" stroke="#1F3FA8" stroke-width="3" marker-end="url(#arr)"/><path d="M725,490 L790,490" fill="none" stroke="#1F3FA8" stroke-width="3" marker-end="url(#arr)"/><path d="M1115,815 L1115,865" fill="none" stroke="#4B8F83" stroke-width="2" marker-end="url(#arr)"/><text x="1115" y="897" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="15" fill="#4B8F83" font-weight="600" text-anchor="middle">用户可以回到整体视图</text><text x="65" y="900" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="18" fill="#1B1A17" font-weight="600" text-anchor="start">架构约束：业务语义来自模型；布局不推导任务依赖；历史能力必须有真实的时间证据。</text></svg>