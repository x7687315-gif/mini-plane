<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520"><title>Incremental engineering roadmap</title><rect width="100%" height="100%" fill="#F4F1EA"/><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1F3FA8"/></marker><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M 28 0 L 0 0 0 28" fill="none" stroke="#C8C3B4" stroke-width="0.7" opacity="0.4"/></pattern></defs><rect width="100%" height="100%" fill="url(#grid)" opacity="0.65"/><text x="60" y="65" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="27" fill="#1F3FA8" font-weight="700" text-anchor="start">INCREMENTAL DELIVERY ROADMAP</text><text x="60" y="110" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="21" fill="#1B1A17" font-weight="500" text-anchor="start">每个阶段都交付一个可体验的完整能力；未来方向保留，不提前过度实现。</text><rect x="60" y="190" width="220" height="210" rx="8" fill="#E2E7F5" stroke="#1F3FA8" stroke-width="2"/><text x="78" y="225" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="14" fill="#1F3FA8" font-weight="700" text-anchor="start">PHASE 0</text><text x="78" y="270" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="21" fill="#1B1A17" font-weight="700" text-anchor="start">设计地基</text><text x="78" y="315" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="15" fill="#5A5851" font-weight="400" text-anchor="start">规则 / 参考原型</text><path d="M282,295 L307,295" fill="none" stroke="#1F3FA8" stroke-width="2" marker-end="url(#arr)"/><rect x="315" y="190" width="220" height="210" rx="8" fill="#E2E7F5" stroke="#1F3FA8" stroke-width="2"/><text x="333" y="225" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="14" fill="#1F3FA8" font-weight="700" text-anchor="start">PHASE 1</text><text x="333" y="270" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="21" fill="#1B1A17" font-weight="700" text-anchor="start">完整对象</text><text x="333" y="315" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="15" fill="#5A5851" font-weight="400" text-anchor="start">数据映射 / 稳定布局</text><path d="M537,295 L562,295" fill="none" stroke="#1F3FA8" stroke-width="2" marker-end="url(#arr)"/><rect x="570" y="190" width="220" height="210" rx="8" fill="#E2E7F5" stroke="#1F3FA8" stroke-width="2"/><text x="588" y="225" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="14" fill="#1F3FA8" font-weight="700" text-anchor="start">PHASE 2</text><text x="588" y="270" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="21" fill="#1B1A17" font-weight="700" text-anchor="start">空间交互</text><text x="588" y="315" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="15" fill="#5A5851" font-weight="400" text-anchor="start">聚焦 / 展开 / 复原</text><path d="M792,295 L817,295" fill="none" stroke="#1F3FA8" stroke-width="2" marker-end="url(#arr)"/><rect x="825" y="190" width="220" height="210" rx="8" fill="#F3E5CE" stroke="#BD873E" stroke-width="2"/><text x="843" y="225" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="14" fill="#BD873E" font-weight="700" text-anchor="start">PHASE 3</text><text x="843" y="270" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="21" fill="#1B1A17" font-weight="700" text-anchor="start">演进痕迹</text><text x="843" y="315" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="15" fill="#5A5851" font-weight="400" text-anchor="start">真实新增 / 状态变化</text><path d="M1047,295 L1072,295" fill="none" stroke="#1F3FA8" stroke-width="2" marker-end="url(#arr)"/><rect x="1080" y="190" width="220" height="210" rx="8" fill="#FBF9F4" stroke="#C8C3B4" stroke-width="2"/><text x="1098" y="225" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="14" fill="#C8C3B4" font-weight="700" text-anchor="start">PHASE 4</text><text x="1098" y="270" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="21" fill="#1B1A17" font-weight="700" text-anchor="start">历史回溯</text><text x="1098" y="315" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="15" fill="#5A5851" font-weight="400" text-anchor="start">事件列表 / 保存快照</text><path d="M1302,295 L1327,295" fill="none" stroke="#1F3FA8" stroke-width="2" marker-end="url(#arr)"/><rect x="1335" y="190" width="220" height="210" rx="8" fill="#FBF9F4" stroke="#C8C3B4" stroke-width="2"/><text x="1353" y="225" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="14" fill="#C8C3B4" font-weight="700" text-anchor="start">PHASE 5</text><text x="1353" y="270" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="21" fill="#1B1A17" font-weight="700" text-anchor="start">构型扩展</text><text x="1353" y="315" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="15" fill="#5A5851" font-weight="400" text-anchor="start">有限原型 / 方案验证</text><text x="60" y="460" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif" font-size="17" fill="#1B1A17" font-weight="600" text-anchor="start">每阶段门禁：数据语义正确 · 交互可恢复 · 键盘可用 · 减少动态效果支持 · 自动化测试通过 · 截图人工审查。</text></svg>